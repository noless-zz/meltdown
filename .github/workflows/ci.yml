name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  test:
    name: Unit tests (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check shell scripts
        run: |
          for script in tools/*.sh; do bash -n "$script"; done
          shellcheck tools/*.sh

      - name: Download Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Import project
        run: godot --headless --path game --import

      - name: Check that the import left the clone clean
        run: tools/check_clean_import.sh

      - name: Run unit tests
        run: godot --headless --path game -s res://tests/run_tests.gd

  build:
    name: Linux server and desktop
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          curl -fsSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          curl -fsSL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          # Only the Linux templates are needed here; the archive holds every platform.
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          mkdir -p "$template_dir"
          unzip -q -j templates.tpz 'templates/version.txt' 'templates/linux_*.x86_64' -d "$template_dir"
          rm -f godot.zip templates.tpz
          ls -lh "$template_dir"

      - name: Export Linux server
        run: tools/build.sh server

      - name: Export Linux desktop client
        run: tools/build.sh desktop

      - name: Run the server headless for five seconds
        run: tools/smoke_server.sh 5

      - uses: actions/upload-artifact@v4
        with:
          name: meltdown-server-linux
          path: build/meltdown-server.x86_64
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: meltdown-desktop-linux
          path: build/meltdown-desktop.x86_64
          if-no-files-found: error

  publish-server:
    # The dedicated server host pulls from a public release because workflow
    # artifacts cannot be downloaded without a login (see tools/install_server.sh).
    name: Publish server build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: main-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: meltdown-server-linux

      - name: Write checksum
        run: |
          sha256sum meltdown-server.x86_64 > meltdown-server.x86_64.sha256
          cat meltdown-server.x86_64.sha256

      - name: Update the rolling pre-release
        run: |
          notes="Latest dedicated server build from main, commit ${GITHUB_SHA}. Replaced on every push; not a versioned release."
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            # Move the tag so the release points at the commit it was built from.
            gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/${RELEASE_TAG}" \
              -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release edit "$RELEASE_TAG" --notes "$notes"
          else
            gh release create "$RELEASE_TAG" --prerelease --target "$GITHUB_SHA" \
              --title "Server build (main)" --notes "$notes"
          fi
          # Checksum last: a host that polls mid-upload sees a mismatch, keeps
          # its current binary and retries an hour later.
          gh release upload "$RELEASE_TAG" meltdown-server.x86_64 --clobber
          gh release upload "$RELEASE_TAG" meltdown-server.x86_64.sha256 --clobber

  publish-clients:
    # A separate job so a failed APK export never holds back the server
    # publish above. It runs after publish-server, which creates the release
    # and moves its tag, so the two jobs never race to create it.
    name: Publish Quest APK and desktop client
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build, quest-apk, publish-server]
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: main-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: meltdown-quest-debug

      - uses: actions/download-artifact@v4
        with:
          name: meltdown-desktop-linux

      - name: Upload builds and checksums
        run: |
          for file in meltdown-quest-debug.apk meltdown-desktop.x86_64; do
            sha256sum "$file" > "$file.sha256"
            cat "$file.sha256"
            # Binary first, checksum last, as for the server.
            gh release upload "$RELEASE_TAG" "$file" --clobber
            gh release upload "$RELEASE_TAG" "$file.sha256" --clobber
          done
          gh release edit "$RELEASE_TAG" --title "Builds (main)" \
            --notes "Latest Quest APK (debug), desktop client and dedicated server from main, commit ${GITHUB_SHA}. Replaced on every push; not a versioned release."

  quest-apk:
    name: Quest APK (debug)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          curl -fsSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          curl -fsSL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q templates.tpz
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          mkdir -p "$template_dir"
          mv templates/* "$template_dir/"
          rm -f godot.zip templates.tpz
          ls "$template_dir" | head -40

      - name: Configure Android toolchain
        run: |
          # A throwaway debug key, generated per build and never committed (DEV-10).
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          for name in editor_settings-4.tres editor_settings-4.7.tres; do
            {
              echo '[gd_resource type="EditorSettings" format=3]'
              echo
              echo '[resource]'
              echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
              echo "export/android/java_sdk_path = \"$JAVA_HOME_17_X64\""
              echo "export/android/debug_keystore = \"$RUNNER_TEMP/debug.keystore\""
              echo 'export/android/debug_keystore_user = "androiddebugkey"'
              echo 'export/android/debug_keystore_pass = "android"'
            } > "$HOME/.config/godot/$name"
          done
          {
            echo "JAVA_HOME=$JAVA_HOME_17_X64"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Export APK
        run: tools/build.sh quest

      - uses: actions/upload-artifact@v4
        with:
          name: meltdown-quest-debug
          path: build/meltdown-quest-debug.apk
          if-no-files-found: error
